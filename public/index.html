<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS Durum Paneli</title>
<style>
  :root {
    --bg: #0B1220;
    --panel: #121B2E;
    --panel-border: #1F2C45;
    --text: #E6EDF7;
    --muted: #8B96A8;
    --up: #3DDC84;
    --warn: #F5A623;
    --down: #FF5C5C;
    --accent: #4C7FFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 20px;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 760px; }
  .eyebrow {
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  h1 { font-size: 28px; margin: 0 0 28px 0; font-weight: 700; }
  .status-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 28px;
    margin-bottom: 20px;
  }
  .status-row { display: flex; align-items: center; gap: 16px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; position: relative; }
  .dot.up { background: var(--up); animation: pulse-up 2s infinite; }
  .dot.warn { background: var(--warn); animation: pulse-warn 1.4s infinite; }
  .dot.down { background: var(--down); animation: pulse-down 1s infinite; }
  @keyframes pulse-up { 0% { box-shadow: 0 0 0 0 rgba(61,220,132,0.45); } 100% { box-shadow: 0 0 0 12px rgba(61,220,132,0); } }
  @keyframes pulse-warn { 0% { box-shadow: 0 0 0 0 rgba(245,166,35,0.45); } 100% { box-shadow: 0 0 0 12px rgba(245,166,35,0); } }
  @keyframes pulse-down { 0% { box-shadow: 0 0 0 0 rgba(255,92,92,0.45); } 100% { box-shadow: 0 0 0 12px rgba(255,92,92,0); } }
  .status-text { font-size: 22px; font-weight: 700; }
  .status-text.up { color: var(--up); }
  .status-text.warn { color: var(--warn); }
  .status-text.down { color: var(--down); }
  .timestamp { font-family: 'IBM Plex Mono', 'Courier New', monospace; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px; padding: 20px; }
  .card h3 { margin: 0 0 12px 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
  .pill { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; font-family: 'IBM Plex Mono', monospace; }
  .pill.up { background: rgba(61,220,132,0.15); color: var(--up); }
  .pill.down { background: rgba(255,92,92,0.15); color: var(--down); }
  .card p.detail { margin: 12px 0 0 0; font-size: 14px; color: var(--text); line-height: 1.5; }
  .rss-list { margin: 12px 0 0 0; padding-left: 18px; font-size: 13px; color: var(--text); line-height: 1.7; }
  .muted { color: var(--muted); font-size: 13px; margin: 12px 0 0 0; }
  .history-card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px; padding: 20px; }
  .history-card h3 { margin: 0 0 4px 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
  .history-sub { font-size: 12px; color: var(--muted); margin: 0 0 16px 0; }
  .pulse-strip { display: flex; align-items: flex-end; gap: 3px; height: 40px; }
  .tick { flex: 1; height: 100%; border-radius: 3px; min-width: 4px; }
  .tick.up { background: var(--up); opacity: 0.85; }
  .tick.warn { background: var(--warn); opacity: 0.9; }
  .tick.down { background: var(--down); }
  .footer { margin-top: 24px; font-size: 12px; color: var(--muted); text-align: center; font-family: 'IBM Plex Mono', monospace; }
  .footer a { color: var(--accent); text-decoration: none; }
  .loading { color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Otomatik İzleme &middot; Her 5 Dakikada Bir Güncellenir</div>
  <h1>AWS Durum Paneli</h1>
  <div id="app"><p class="loading">Yükleniyor…</p></div>
  <div class="footer">
    Kaynak: <a href="https://downdetector.com/status/amazon-aws/" target="_blank">DownDetector</a>
    &middot;
    <a href="https://status.aws.amazon.com/rss/all.rss" target="_blank">AWS Status RSS</a>
    <br>Sayfa 60 saniyede bir otomatik yenilenir.
  </div>
</div>

<script>
async function loadStatus() {
  try {
    const res = await fetch('/api/status', { cache: 'no-store' });
    const data = await res.json();
    render(data);
  } catch (e) {
    document.getElementById('app').innerHTML =
      '<p class="loading">Veri alınamadı, birkaç saniye sonra tekrar denenecek…</p>';
  }
}

function pill(isProblem) {
  const cls = isProblem ? 'down' : 'up';
  const text = isProblem ? 'Sorun bildirildi' : 'Normal';
  return `<span class="pill ${cls}">${text}</span>`;
}

function render(data) {
  const history = data.history || [];
  const dd = !!data.ddProblem;
  const aws = !!data.awsProblem;
  const confirmed = !!data.confirmedProblem;

  let overallLabel, overallClass;
  if (confirmed) { overallLabel = 'SORUN VAR'; overallClass = 'down'; }
  else if (dd && !aws) { overallLabel = 'DOĞRULANMAMIŞ SİNYAL'; overallClass = 'warn'; }
  else { overallLabel = 'HER ŞEY YOLUNDA'; overallClass = 'up'; }

  const lastChecked = data.lastChecked
    ? new Date(data.lastChecked).toLocaleString('tr-TR')
    : 'Henüz kontrol edilmedi';

  const awsItemsHtml = (data.awsItems && data.awsItems.length)
    ? `<ul class="rss-list">${data.awsItems.slice(0, 5).map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul>`
    : `<p class="muted">Son 60 dakikada resmi AWS feed'inde yeni giriş yok.</p>`;

  const ticks = history.length
    ? history.map(h => {
        const cls = h.confirmedProblem ? 'down' : (h.ddProblem ? 'warn' : 'up');
        const t = new Date(h.time).toLocaleString('tr-TR');
        const label = h.confirmedProblem ? 'SORUN' : (h.ddProblem ? 'Sinyal' : 'Normal');
        return `<div class="tick ${cls}" title="${t} — ${label}"></div>`;
      }).join('')
    : '<p class="muted">Henüz geçmiş kayıt yok.</p>';

  document.getElementById('app').innerHTML = `
    <div class="status-card">
      <div class="status-row">
        <div class="dot ${overallClass}"></div>
        <div>
          <div class="status-text ${overallClass}">${overallLabel}</div>
          <div class="timestamp">Son kontrol: ${lastChecked}</div>
        </div>
      </div>
    </div>
    <div class="grid">
      <div class="card">
        <h3>DownDetector</h3>
        ${pill(dd)}
        <p class="detail">${escapeHtml(data.status || '-')}</p>
      </div>
      <div class="card">
        <h3>AWS Resmi Durum Feed'i</h3>
        ${pill(aws)}
        ${awsItemsHtml}
      </div>
    </div>
    <div class="history-card">
      <h3>Geçmiş Kontroller</h3>
      <p class="history-sub">En eski &rarr; en yeni (sağda). Her çubuk bir kontrolü temsil eder.</p>
      <div class="pulse-strip">${ticks}</div>
    </div>
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadStatus();
setInterval(loadStatus, 60000);
</script>
</body>
</html>
